# Integration tests: Postgres (and Mongo where used) come from Testcontainers; everything that dials out is off.
spring:
  # test-support brings JPA onto the test classpath; this service keeps everything in MongoDB.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  rabbitmq:
    host: localhost
    username: guest
    password: guest
    virtual-host: /
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never fetched: MockMvc requests carry an already-decoded token.
          issuer-uri: https://securetoken.google.com/test
          jwk-set-uri: http://localhost/never-fetched
  mail:
    # Never dialled: the tests replace the mail sender.
    username: no-reply@example.com
    password: unused

# The listeners' own retries and dead-letter queues are what these tests check, against a real broker.
rabbitmq:
  enabled: true

firebase:
  enabled: false

eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false
