spring:
  application:
    name: notification
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
  mail:
      host: smtp.gmail.com
      port: 465
      username: contact@shinesofthub.com
      password: ${SMTP_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            ssl:
              enable: true

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans