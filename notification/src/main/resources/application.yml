spring:
  application:
    name: notification
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
  data:
    mongodb:
      uri: mongodb://${MONGODB_HOST:mongodb}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:jobbie_giggle_notification}
      auto-index-creation: true
  mail:
      host: smtp.gmail.com
      port: 465
      username: contact@shinesofthub.com
      password: ${SMTP_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            ssl:
              enable: true

firebase:
  # Set to false to run without push notifications; push requests are then logged and dropped.
  enabled: ${FIREBASE_ENABLED:true}
  project-id: jobbiegiggle

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans