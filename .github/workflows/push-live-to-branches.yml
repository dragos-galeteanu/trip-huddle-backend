name: Push live to branches

on:
  push:
    branches:
      - live

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      # A push made with GITHUB_TOKEN starts no workflows, so main and e2e-testing would never run their tests
      # after a merge. A GitHub App's token does start them. The App needs contents: write on this repository;
      # its ID and private key are the MERGE_APP_ID and MERGE_APP_PRIVATE_KEY secrets.
      - name: Get a token for the merge app
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set Git identity
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: git fetch origin

      # ---- E2E TESTING ----
      - name: Merge live into e2e-testing
        run: |
          git checkout e2e-testing
          git merge origin/live --no-edit
          git push origin e2e-testing

      # ---- MAIN ----
      - name: Merge live into main
        run: |
          git checkout main
          git merge origin/live --no-edit
          git push origin main
