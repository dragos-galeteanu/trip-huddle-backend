name: Unit & Integration Testing

on:
  schedule:
    - cron: '0 00 * * *'
  workflow_dispatch:
  # smoke-testing.yml runs this first, so smoke tests start only once these pass.
  workflow_call:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
      - e2e-testing
      - live
  push:
    branches:
      - main
      - e2e-testing
      - live

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit tests (*Test, Surefire) and integration tests (*IT, Failsafe, Testcontainers on the runner's Docker),
      # then the JaCoCo report and, in modules that enforce it, the coverage gate.
      - name: Run unit and integration tests
        env:
          FIREBASE_ENABLED: false
        run: |
          mvn -B -ntp verify \
            -Dfirebase.enabled=false \
            -Dsurefire.useFile=false \
            -Dsurefire.printSummary=true \
            -Dsurefire.reportFormat=plain

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco-merged/
          if-no-files-found: ignore
