name: Mutation Testing

# PIT on the service and security packages, nightly and on demand. Report only: nothing fails on its score.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit tests only: PIT reruns them for every mutant, and integration tests would take hours.
      - name: Run PIT
        run: mvn -B -ntp -Pmutation -DskipITs test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: '**/target/pit-reports/'
          if-no-files-found: ignore
