server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/jobbiegiggle
          jwk-set-uri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
  cloud:
    gateway:
      routes:
        - id: user
          uri: lb://USER
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user
                fallbackUri: forward:/fallback
        - id: user-swagger
          uri: lb://USER
          predicates:
            - Path=/user/v3/api-docs
          filters:
            - RewritePath=/user/v3/api-docs, /api-docs
        - id: platform
          uri: lb://PLATFORM
          predicates:
            - Path=/api/v1/platform/**
          filters:
            - name: CircuitBreaker
              args:
                name: platform
                fallbackUri: forward:/fallback
        - id: platform-swagger
          uri: lb://PLATFORM
          predicates:
            - Path=/platform/v3/api-docs
          filters:
            - RewritePath=/platform/v3/api-docs, /api-docs
  discovery:
    locator:
      enabled: true
      lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5

resilience4j:
  timelimiter:
    instances:
      user:
        timeoutDuration: 60s
      platform:
        timeoutDuration: 60s

management:
  endpoints:
    web:
      exposure:
        include: gateway
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans