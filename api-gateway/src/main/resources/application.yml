server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/jobbiegiggle
          jwk-set-uri: https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
  cloud:
    gateway:
      routes:
        - id: api-user
          uri: lb://API-USER
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: api-user
                fallbackUri: forward:/fallback
        - id: api-user-swagger
          uri: lb://API-USER
          predicates:
            - Path=/api-user/v3/api-docs
          filters:
            - RewritePath=/api-user/v3/api-docs, /api-docs
        - id: api-destination
          uri: lb://API-DESTINATION
          predicates:
            - Path=/api/v1/destinations/**
          filters:
            - name: CircuitBreaker
              args:
                name: api-destination
                fallbackUri: forward:/fallback
        - id: api-destination-swagger
          uri: lb://API-DESTINATION
          predicates:
            - Path=/api-destination/v3/api-docs
          filters:
            - RewritePath=/api-destination/v3/api-docs, /api-docs
        - id: api-group
          uri: lb://API-GROUP
          predicates:
            - Path=/api/v1/groups/**
          filters:
            - name: CircuitBreaker
              args:
                name: api-group
                fallbackUri: forward:/fallback
        - id: api-group-swagger
          uri: lb://API-GROUP
          predicates:
            - Path=/api-group/v3/api-docs
          filters:
            - RewritePath=/api-group/v3/api-docs, /api-docs
        - id: api-chat
          uri: lb://API-CHAT
          predicates:
            - Path=/api/v1/chats/**
          filters:
            - name: CircuitBreaker
              args:
                name: api-chat
                fallbackUri: forward:/fallback
        # No circuit breaker or time limit here: they would cut every socket after 60 seconds.
        - id: api-chat-websocket
          uri: lb:ws://API-CHAT
          predicates:
            - Path=/ws/chats/**
        - id: api-chat-swagger
          uri: lb://API-CHAT
          predicates:
            - Path=/api-chat/v3/api-docs
          filters:
            - RewritePath=/api-chat/v3/api-docs, /api-docs
        - id: api-license
          uri: lb://API-LICENSE
          predicates:
            - Path=/api/v1/licenses/**
          filters:
            - name: CircuitBreaker
              args:
                name: api-license
                fallbackUri: forward:/fallback
        - id: api-license-swagger
          uri: lb://API-LICENSE
          predicates:
            - Path=/api-license/v3/api-docs
          filters:
            - RewritePath=/api-license/v3/api-docs, /api-docs
        - id: api-payment
          uri: lb://API-PAYMENT
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: api-payment
                fallbackUri: forward:/fallback
        - id: api-payment-swagger
          uri: lb://API-PAYMENT
          predicates:
            - Path=/api-payment/v3/api-docs
          filters:
            - RewritePath=/api-payment/v3/api-docs, /api-docs
        - id: api-platform
          uri: lb://API-PLATFORM
          predicates:
            - Path=/api/v1/platform/**
          filters:
            - name: CircuitBreaker
              args:
                name: api-platform
                fallbackUri: forward:/fallback
        - id: api-platform-swagger
          uri: lb://API-PLATFORM
          predicates:
            - Path=/api-platform/v3/api-docs
          filters:
            - RewritePath=/api-platform/v3/api-docs, /api-docs
  discovery:
    locator:
      enabled: true
      lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 5

resilience4j:
  timelimiter:
    instances:
      api-user:
        timeoutDuration: 60s
      api-platform:
        timeoutDuration: 60s
      api-license:
        timeoutDuration: 60s
      api-payment:
        timeoutDuration: 60s
      api-destination:
        timeoutDuration: 60s
      api-group:
        timeoutDuration: 60s
      api-chat:
        timeoutDuration: 60s

management:
  endpoints:
    web:
      exposure:
        # Health only. The gateway endpoint can add and change routes, so it stays off.
        include: health
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans